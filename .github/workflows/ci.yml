name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build API and web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          version: 12.6.0
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic regression suite
        run: pnpm test

      - name: Build API
        run: pnpm build

      - name: Build web app
        run: pnpm build:web
